<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My PDFs | Shift PDF</title>
    <meta name="title" content="My PDFs | Shift PDF" />
    <meta
      name="description"
      content="Browse and manage PDFs saved in your Shift PDF library. Set a selected file to use across tools."
    />
    <meta name="author" content="Shift" />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="My PDFs | Shift PDF" />
    <meta
      property="og:description"
      content="Browse and manage PDFs saved in your browser library."
    />
    <meta property="og:site_name" content="Shift PDF" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="My PDFs | Shift PDF" />
    <meta
      name="twitter:description"
      content="Browse and manage PDFs saved in your browser library."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shift PDF" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/shift-pdf-logo.svg" />
    <link href="src/css/styles.css" rel="stylesheet" />
  </head>

  <body class="antialiased shift-home">
    {{> navbar }}

    <div id="app" class="min-h-screen container mx-auto p-4 md:p-8">
      <section
        id="shift-my-pdfs"
        class="shift-my-pdfs"
        aria-labelledby="shift-my-pdfs-heading"
        data-view="thumbnail"
      >
        <div class="shift-open-file-header">
          <h2 id="shift-my-pdfs-heading">My PDFs</h2>
          <div class="shift-open-file-header-controls">
            <div
              id="shift-open-file-tools"
              class="shift-open-file-tools"
              role="group"
              aria-label="Open with"
              hidden
            >
              <span>Open with</span>
              <div class="shift-open-file-tools-toggle">
                <a
                  href="compress-pdf.html"
                  class="shift-open-file-tool-btn"
                  data-tool="compress"
                  >Compress</a
                >
                <a
                  href="merge-pdf.html"
                  class="shift-open-file-tool-btn"
                  data-tool="merge"
                  >Merge</a
                >
                <a
                  href="pdf-converter.html"
                  class="shift-open-file-tool-btn"
                  data-tool="convert"
                  >Convert</a
                >
                <a
                  href="sign-pdf.html"
                  class="shift-open-file-tool-btn"
                  data-tool="esign"
                  >E-sign</a
                >
              </div>
            </div>
            <div
              class="shift-open-file-view-by"
              role="group"
              aria-label="View by"
              data-i18n-aria-label="home.viewBy"
            >
              <span data-i18n="home.viewBy">View by</span>
              <div class="shift-open-file-view-toggle">
                <button
                  type="button"
                  id="shift-open-file-view-list"
                  class="shift-open-file-view-btn"
                  data-view="list"
                  aria-pressed="false"
                  data-i18n-aria-label="home.viewList"
                  aria-label="List view"
                >
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path
                      d="M3 4h10M3 8h10M3 12h10"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  id="shift-open-file-view-thumbnail"
                  class="shift-open-file-view-btn"
                  data-view="thumbnail"
                  aria-pressed="true"
                  data-i18n-aria-label="home.viewThumbnail"
                  aria-label="Thumbnail view"
                >
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <rect
                      x="2.5"
                      y="2.5"
                      width="4.5"
                      height="4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="9"
                      y="2.5"
                      width="4.5"
                      height="4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="2.5"
                      y="9"
                      width="4.5"
                      height="4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="9"
                      y="9"
                      width="4.5"
                      height="4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          id="drop-zone"
          class="shift-home-drop-zone relative flex flex-col items-center justify-center w-full border-2 border-dashed rounded-xl cursor-pointer"
        >
          <svg
            class="shift-home-drop-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="40"
            height="40"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 16V8M8.5 11.5 12 8l3.5 3.5"
            />
          </svg>
          <p class="shift-home-drop-hint">
            <span data-i18n="home.dropHintPrefix">Drag &amp; Drop or</span>
            <button
              type="button"
              class="shift-home-choose-files"
              data-i18n="home.chooseFiles"
            >
              Choose files
            </button>
            <span data-i18n="home.dropHintSuffix">(PDFs only) to upload.</span>
          </p>
          <input
            id="file-input"
            type="file"
            accept="application/pdf,.pdf"
            multiple
            hidden
          />
        </div>

        <table class="shift-my-pdfs-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="home.columnName">Name</th>
              <th scope="col" data-i18n="home.columnDateAdded">Date added</th>
              <th scope="col" data-i18n="home.columnSize">Size</th>
              <th scope="col">
                <span class="sr-only" data-i18n="home.columnActions"
                  >Actions</span
                >
              </th>
            </tr>
          </thead>
          <tbody id="shift-my-pdfs-body"></tbody>
        </table>
        <div id="shift-my-pdfs-thumbs" class="shift-open-file-thumbs"></div>
      </section>

      <div
        id="loader-modal"
        class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50"
      >
        <div
          class="bg-gray-800 p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-700 shadow-xl"
        >
          <div class="solid-spinner"></div>
          <p
            id="loader-text"
            class="text-white text-lg font-medium"
            data-i18n="loader.processing"
          >
            Processing...
          </p>
        </div>
      </div>

      <div
        id="alert-modal"
        class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4"
      >
        <div
          class="bg-gray-800 max-w-sm w-full p-6 rounded-lg border border-gray-700 shadow-xl text-center"
        >
          <h3 id="alert-title" class="text-xl font-bold text-white mb-2">
            Alert
          </h3>
          <p id="alert-message" class="text-gray-300 mb-6 whitespace-pre-line">
            This is an alert message.
          </p>
          <button
            id="alert-ok"
            class="btn bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700"
          >
            OK
          </button>
        </div>
      </div>

      {{> settings-modal }} {{> warning-modal }}
    </div>

    {{> footer }}

    <script type="module" src="src/js/utils/lucide-init.ts"></script>
    <script type="module" src="src/js/main.ts"></script>
    <script type="module" src="src/js/sw-register.ts"></script>
  </body>
</html>
