{{#if simpleMode}} {{> navbar-simple}} {{else}}
<aside
  id="shift-sidebar"
  class="shift-sidebar"
  aria-label="Shift PDF navigation"
>
  <div class="shift-sidebar-content">
    <div class="shift-sidebar-header">
      <a href="{{baseUrl}}index.html" class="shift-logo" id="home-logo">
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/shift-pdf-logo.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Shift PDF{{/if}} Logo"
          class="shift-logo-img"
        />
        <span id="nav-brand" class="shift-logo-text">
          {{#if brandName}}{{brandName}}{{else}}PDF{{/if}}
        </span>
      </a>
    </div>

    <section
      id="shift-open-files"
      class="shift-open-files"
      aria-labelledby="shift-open-files-heading"
    >
      <h2 id="shift-open-files-heading" class="shift-sidebar-section-title">
        My PDFs
      </h2>
      <nav class="shift-primary-nav" aria-label="Library">
        <a
          href="{{baseUrl}}my-pdfs.html"
          class="shift-nav-link"
          data-nav="my-pdfs"
        >
          <svg
            class="shift-nav-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9.75 3.75h8.5a1 1 0 0 1 1 1v11M8.25 5.75h8.5a1 1 0 0 1 1 1v.5M6.75 7.75h8.5a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H6.75a1 1 0 0 1-1-1v-9.5a1 1 0 0 1 1-1Z"
            />
          </svg>
          <span class="shift-nav-label">My PDFs</span>
        </a>
      </nav>
      <div
        id="shift-open-files-list"
        class="shift-open-files-list"
        aria-label="Selected files"
        hidden
      ></div>
    </section>

    <section class="shift-tools" aria-labelledby="shift-tools-heading">
      <h2 id="shift-tools-heading" class="shift-sidebar-section-title">
        Tools
      </h2>
      <nav class="shift-tools-nav" aria-label="Tools">
        <a
          href="{{baseUrl}}all-tools.html"
          class="shift-nav-link"
          data-nav="home"
        >
          <svg
            class="shift-nav-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M19.25 19.25 15.5 15.5M4.75 11a6.25 6.25 0 1 1 12.5 0 6.25 6.25 0 0 1-12.5 0"
            />
          </svg>
          <span class="shift-nav-label">All tools</span>
        </a>
        <div
          id="shift-favorite-tools"
          class="shift-favorite-tools"
          aria-label="Favorite tools"
        ></div>
      </nav>
    </section>

    <div class="shift-sidebar-footer">
      <button
        id="shift-sidebar-collapse"
        type="button"
        class="shift-nav-link shift-collapse-btn"
        aria-controls="shift-sidebar"
        aria-expanded="true"
        title="Collapse sidebar"
      >
        <svg
          class="shift-nav-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M4.75 6.75a2 2 0 0 1 2-2h10.5a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H6.75a2 2 0 0 1-2-2zM9.75 5v14"
          />
        </svg>
        <span class="shift-nav-label">Collapse</span>
      </button>
    </div>
  </div>
</aside>
{{/if}}
