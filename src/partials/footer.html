{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-16 border-t py-8 shift-footer">
  <div class="container mx-auto px-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 text-center md:text-left">
      <div class="flex items-center justify-center md:justify-start gap-3">
        <img
          id="footer-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/shift-pdf-logo.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Shift PDF{{/if}} Logo"
          class="h-8 w-8"
        />
        <div>
          <span id="footer-brand" class="text-lg font-bold">{{#if brandName}}{{brandName}}{{else}}Shift PDF{{/if}}</span>
          <p id="footer-copyright" class="text-sm text-gray-400" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
            {{#if footerText}}{{footerText}}{{else}}Shift PDF experimental — client-side toolkit{{/if}}
          </p>
        </div>
      </div>
      <nav
        class="flex items-center justify-center gap-5 text-sm"
        aria-label="About Shift PDF"
      >
        <a
          href="{{baseUrl}}about.html"
          class="text-gray-400 hover:text-white transition-colors"
          >About</a
        >
        <a
          href="{{baseUrl}}licensing.html"
          class="text-gray-400 hover:text-white transition-colors"
          >Source</a
        >
      </nav>
      <p class="text-xs text-gray-400">
        <span data-i18n="footer.version">Version</span>
        <span id="app-version">{{appVersion}}</span>
      </p>
    </div>
  </div>
</footer>
{{/if}}
