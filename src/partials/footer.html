{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-8 border-t py-3 shift-footer">
  <div class="container mx-auto px-4">
    <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-1">
      <div class="flex min-w-0 items-center gap-2">
        <img
          id="footer-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/shift-pdf-logo.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Shift PDF{{/if}} Logo"
          class="h-5 w-5"
        />
        <span id="footer-brand" class="text-sm font-semibold">{{#if brandName}}{{brandName}}{{else}}Shift PDF{{/if}}</span>
        <p id="footer-copyright" class="hidden truncate text-xs text-gray-400 sm:block" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
          {{#if footerText}}{{footerText}}{{else}}Shift PDF — files stay in your browser{{/if}}
        </p>
      </div>
      <nav
        class="flex items-center gap-4 text-xs"
        aria-label="About and source"
      >
        <a
          href="{{baseUrl}}about.html"
          class="text-gray-400 hover:text-white transition-colors"
          title="How privacy works"
          >About</a
        >
        <a
          href="{{baseUrl}}licensing.html"
          class="text-gray-400 hover:text-white transition-colors"
          title="View corresponding source"
          >Source</a
        >
      </nav>
      <p class="text-xs text-gray-400">
        <span data-i18n="footer.version">Version</span>
        <span id="app-version">{{appVersion}}</span>
      </p>
    </div>
  </div>
</footer>
{{/if}}
