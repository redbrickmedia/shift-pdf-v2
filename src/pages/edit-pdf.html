<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Edit PDF Online Free - Edit PDF Tool | Shift PDF"
    />
    <meta
      name="description"
      content="★ Edit PDF online free - Edit PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />
    <meta
      name="keywords"
      content="edit pdf, pdf editor, modify pdf, change pdf"
    />
    <meta name="author" content="Shift PDF" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Edit PDF Online Free - Edit PDF Tool | Shift PDF"
    />
    <meta
      property="og:description"
      content="★ Edit PDF online free - Edit PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />

    <meta property="og:site_name" content="Shift PDF" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:title" content="Edit PDF Free" />
    <meta
      name="twitter:description"
      content="★ Edit PDF online free - Edit PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secu"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Edit PDF" />

    <title>PDF Editor | Shift PDF</title>
    <meta
      name="description"
      content="Annotate, highlight, redact, comment, add shapes/images, search, and view PDFs. Free, secure, and runs entirely in your browser."
    />

    <link href="/src/css/styles.css" rel="stylesheet" />
    <link
      href="../../node_modules/cropperjs/dist/cropper.min.css"
      rel="stylesheet"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/shift-pdf-logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div
      id="uploader"
      class="min-h-screen flex flex-col items-center justify-start py-12 p-4 bg-gray-900"
    >
      <header class="shift-pdf-viewer-header">
        <div class="shift-pdf-viewer-heading">
          <h1 data-i18n="tools:pdfEditor.name">PDF Editor</h1>
          <p data-viewer-chrome="subtitle" data-i18n="tools:pdfEditor.subtitle">
            Annotate, highlight, redact, comment, add shapes/images, search, and
            view PDFs.
          </p>
        </div>

        <div
          id="edit-pdf-mode-switcher"
          role="tablist"
          aria-label="Edit PDF modes"
          class="flex gap-2 p-1 rounded-lg bg-gray-900 border border-gray-700"
        >
          <button
            id="mode-annotate-btn"
            type="button"
            role="tab"
            data-edit-mode="annotate"
            aria-selected="true"
            class="flex-1 btn bg-indigo-600 text-white font-semibold py-2 px-3 rounded-md"
          >
            Annotate &amp; Redact
          </button>
          <button
            id="mode-fill-sign-btn"
            type="button"
            role="tab"
            data-edit-mode="fill-sign"
            aria-selected="false"
            class="flex-1 btn text-gray-300 font-semibold py-2 px-3 rounded-md"
          >
            Fill &amp; Sign
          </button>
          <button
            id="mode-crop-btn"
            type="button"
            role="tab"
            data-edit-mode="crop"
            aria-selected="false"
            class="flex-1 btn text-gray-300 font-semibold py-2 px-3 rounded-md"
          >
            Crop
          </button>
        </div>

        <div
          class="shift-pdf-viewer-actions shift-action-row"
          data-shift-viewer-actions
          role="group"
          aria-label="PDF actions"
        >
          <label
            class="shift-pdf-viewer-flatten"
            data-viewer-chrome="flatten"
            data-shift-action="flatten"
            hidden
            title="Flattened output visibly burns signatures into pages and removes their edit controls."
            data-i18n-title="tools:signPdf.flattenHint"
          >
            <input
              type="checkbox"
              id="flatten-signature-toggle"
              class="shift-pdf-viewer-flatten-input"
              aria-label="Flatten signatures into page content"
            />
            <span data-i18n="tools:signPdf.flattenLabel"
              >Flatten signatures into page content</span
            >
          </label>
          <button
            id="shift-sign-add"
            class="shift-pdf-viewer-action shift-action-button"
            type="button"
            data-viewer-chrome="sign"
            data-shift-action="sign"
            hidden
            aria-label="Sign"
          >
            <i class="ph ph-pen-nib" aria-hidden="true"></i>
            <span>Sign</span>
          </button>
        </div>
      </header>

      <div
        id="tool-uploader"
        class="bg-gray-800 rounded-xl shadow-xl px-4 py-8 md:p-8 max-w-2xl w-full text-blue-400 border border-gray-700"
      >
        <div
          id="drop-zone"
          class="relative flex flex-col items-center justify-center w-full h-48 md:h-64 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-900 hover:bg-gray-700 transition-colors duration-300"
        >
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <i
              data-lucide="circle-arrow-up"
              class="w-10 h-10 mb-3 text-gray-400"
            ></i>
            <p class="mb-2 text-sm text-gray-400">
              <span class="font-semibold" data-i18n="upload.clickToSelect"
                >Click to select a file</span
              >
              <span data-i18n="upload.orDragAndDrop">or drag and drop</span>
            </p>
            <p class="text-xs text-gray-500" data-i18n="upload.hints.pdfFile">
              PDF file
            </p>
            <p class="text-xs text-gray-500" data-i18n="upload.filesNeverLeave">
              Your files never leave your device.
            </p>
          </div>
          <input
            id="file-input"
            type="file"
            class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
            accept="application/pdf"
          />
        </div>

        <div id="file-display-area" class="mt-4 space-y-2"></div>

        <div id="embed-pdf-wrapper" class="hidden mt-6">
          <div
            id="embed-pdf-container"
            class="w-full h-[75vh] border border-gray-600 rounded-lg"
          ></div>

          <div id="fill-sign-stage" class="hidden w-full h-[75vh]">
            <div
              id="canvas-container-sign"
              class="shift-pdf-viewer-frame w-full h-full"
            ></div>
          </div>

          <div id="cropper-editor" class="hidden w-full">
            <div
              class="flex flex-col md:flex-row items-center justify-between gap-4 mb-4 p-3 bg-gray-800 rounded-lg border border-gray-700"
            >
              <div id="page-nav" class="flex items-center gap-2">
                <button
                  id="prev-page"
                  type="button"
                  class="btn p-2 rounded-full bg-gray-700 hover:bg-gray-600"
                  title="Previous Page"
                  disabled
                >
                  <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <span id="page-info" class="text-white font-medium px-2"
                  >Page 1 of 1</span
                >
                <button
                  id="next-page"
                  type="button"
                  class="btn p-2 rounded-full bg-gray-700 hover:bg-gray-600"
                  title="Next Page"
                  disabled
                >
                  <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
              </div>

              <div class="flex flex-col md:flex-row gap-4">
                <label
                  class="flex items-center gap-2 text-sm font-medium text-gray-300 cursor-pointer"
                >
                  <input
                    type="checkbox"
                    id="destructive-crop-toggle"
                    class="w-4 h-4 rounded text-indigo-600 bg-gray-700 border-gray-600 focus:ring-indigo-500"
                  />
                  Flattening Crop (converts pages to images)
                </label>
                <label
                  class="flex items-center gap-2 text-sm font-medium text-gray-300 cursor-pointer"
                >
                  <input
                    type="checkbox"
                    id="apply-to-all-toggle"
                    class="w-4 h-4 rounded text-indigo-600 bg-gray-700 border-gray-600 focus:ring-indigo-500"
                  />
                  Apply to all pages
                </label>
              </div>
            </div>

            <div
              id="cropper-container"
              class="w-full relative overflow-hidden flex items-center justify-center bg-gray-900 rounded-lg border border-gray-600 min-h-[500px]"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="loader-modal"
      class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50"
    >
      <div
        class="bg-gray-800 p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-700 shadow-xl"
      >
        <div class="solid-spinner"></div>
        <p id="loader-text" class="text-white text-lg font-medium">
          Processing...
        </p>
      </div>
    </div>

    <div
      id="alert-modal"
      class="fixed inset-0 bg-gray-900/90 flex items-center justify-center z-50 hidden"
    >
      <div
        class="bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full border border-gray-700"
      >
        <h3
          id="alert-title"
          class="text-xl font-bold text-white mb-2"
          data-i18n="alert.title"
        >
          Alert
        </h3>
        <p id="alert-message" class="text-gray-300 mb-6"></p>
        <button
          id="alert-ok"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200"
        >
          OK
        </button>
      </div>
    </div>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/edit-pdf-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>

    <!-- JSON-LD Structured Data -->
  </body>
</html>
