<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Edit Attachments Online Free - Edit Attachments Tool | Shift PDF"
    />
    <meta
      name="description"
      content="★ Edit Attachments online free - Edit attachments PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />
    <meta
      name="keywords"
      content="edit attachments, edit attachments, online pdf"
    />
    <meta name="author" content="Shift PDF" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Edit Attachments Online Free - Edit Attachments Tool | Shift PDF"
    />
    <meta
      property="og:description"
      content="★ Edit Attachments online free - Edit attachments PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />

    <meta property="og:site_name" content="Shift PDF" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:title" content="Edit Attachments Free" />
    <meta
      name="twitter:description"
      content="★ Edit Attachments online free - Edit attachments PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in b"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Edit Attachments" />

    <title>Edit Attachments | Shift PDF</title>
    <meta
      name="description"
      content="View and remove attachments from your PDF documents. Manage embedded files easily. Free, secure, and runs entirely in your browser."
    />

    <link href="/src/css/styles.css" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/shift-pdf-logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div
      id="uploader"
      class="min-h-screen flex flex-col items-center justify-start py-12 p-4 bg-gray-900"
    >
      <div
        id="tool-uploader"
        class="bg-gray-800 rounded-xl shadow-xl px-4 py-8 md:p-8 max-w-2xl w-full text-gray-200 border border-gray-700"
      >
        <h1
          class="text-2xl font-bold text-white mb-2"
          data-i18n="tools:editAttachments.name"
        >
          Edit Attachments
        </h1>
        <p
          class="text-gray-400 mb-6"
          data-i18n="tools:editAttachments.subtitle"
        >
          View or remove attachments in your PDF.
        </p>

        <div
          id="drop-zone"
          class="relative flex flex-col items-center justify-center w-full h-48 md:h-64 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-900 hover:bg-gray-700 transition-colors duration-300"
        >
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <i
              data-lucide="circle-arrow-up"
              class="w-10 h-10 mb-3 text-gray-400"
            ></i>
            <p class="mb-2 text-sm text-gray-400">
              <span class="font-semibold" data-i18n="upload.clickToSelect"
                >Click to select a file</span
              >
              <span data-i18n="upload.orDragAndDrop">or drag and drop</span>
            </p>
            <p class="text-xs text-gray-500" data-i18n="upload.filesNeverLeave">
              Your files never leave your device.
            </p>
          </div>
          <input
            id="file-input"
            type="file"
            class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
            accept="application/pdf"
            multiple
          />
        </div>

        <div id="file-controls" class="hidden mt-4 flex gap-3">
          <button
            id="add-more-btn"
            type="button"
            class="btn bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-2"
          >
            <i data-lucide="plus"></i>
            <span data-i18n="upload.addMore">Add More Files</span>
          </button>
          <button
            id="clear-files-btn"
            type="button"
            class="btn bg-gray-700 hover:bg-gray-600 text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-2"
          >
            <i data-lucide="x"></i>
            <span data-i18n="upload.clearAll">Clear All</span>
          </button>
        </div>

        <div id="file-display-area" class="mt-4 space-y-2"></div>

        <div id="tool-options" class="hidden mt-6 space-y-6">
          <div
            class="flex gap-2 p-1 rounded-lg bg-gray-900 border border-gray-700"
            role="tablist"
            aria-label="Attachment modes"
          >
            <button
              id="mode-edit"
              type="button"
              class="flex-1 btn bg-indigo-600 text-white font-semibold py-2 rounded-md text-sm"
              aria-pressed="true"
            >
              Edit &amp; Manage
            </button>
            <button
              id="mode-add"
              type="button"
              class="flex-1 btn text-gray-300 font-semibold py-2 rounded-md text-sm"
              aria-pressed="false"
            >
              Add Attachments
            </button>
            <button
              id="mode-extract"
              type="button"
              class="flex-1 btn text-gray-300 font-semibold py-2 rounded-md text-sm"
              aria-pressed="false"
            >
              Extract Attachments
            </button>
          </div>

          <div id="existing-attachments-section" class="space-y-3">
            <h2 class="text-lg font-semibold text-white">
              Existing Attachments
            </h2>
            <div id="attachments-list" class="space-y-2"></div>
          </div>

          <div
            id="add-attachments-section"
            class="border-t border-gray-700 pt-6 space-y-4"
          >
            <h2 class="text-lg font-semibold text-white">
              Select Files to Attach
            </h2>

            <div
              id="attachment-drop-zone"
              class="relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-900 hover:bg-gray-700 transition-colors duration-300"
            >
              <div class="flex flex-col items-center justify-center">
                <i
                  data-lucide="paperclip"
                  class="w-8 h-8 mb-2 text-gray-400"
                ></i>
                <p class="text-sm text-gray-400">
                  Click or drop files to attach
                </p>
                <p class="text-xs text-gray-500">Any file type</p>
              </div>
              <input
                id="attachment-files-input"
                type="file"
                class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
                multiple
              />
            </div>

            <div id="attachment-file-list" class="space-y-2"></div>

            <div id="attachment-level-options" class="hidden mt-4">
              <h3 class="text-md font-medium text-white mb-2">
                Attachment Level
              </h3>
              <div class="flex gap-4 mb-3">
                <label class="flex items-center gap-2 text-gray-300">
                  <input
                    type="radio"
                    name="attachment-level"
                    value="document"
                    checked
                    class="accent-indigo-500"
                  />
                  <span>Document Level</span>
                </label>
                <label class="flex items-center gap-2 text-gray-300">
                  <input
                    type="radio"
                    name="attachment-level"
                    value="page"
                    class="accent-indigo-500"
                  />
                  <span>Page Level</span>
                </label>
              </div>

              <div id="page-range-wrapper" class="hidden mb-4">
                <label
                  for="attachment-page-range"
                  class="text-sm text-gray-400 block mb-1"
                >
                  Page Range (e.g., 1,3,5-7) - Total:
                  <span id="attachment-total-pages">0</span> pages
                </label>
                <input
                  type="text"
                  id="attachment-page-range"
                  placeholder="1,3,5-7"
                  class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-3 py-2 text-sm"
                />
              </div>
            </div>
          </div>

          <div
            id="status-message"
            class="hidden mt-4 p-3 rounded-lg text-sm"
          ></div>

          <button id="process-btn" class="hidden btn-gradient w-full mt-4">
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <!-- Loader Modal -->
    <div
      id="loader-modal"
      class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50"
    >
      <div
        class="bg-gray-800 p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-700 shadow-xl"
      >
        <div class="solid-spinner"></div>
        <p
          id="loader-text"
          class="text-white text-lg font-medium"
          data-i18n="loader.processing"
          data-i18n="loader.processing"
        >
          Processing...
        </p>
      </div>
    </div>

    <!-- Alert Modal -->
    <div
      id="alert-modal"
      class="fixed inset-0 bg-gray-900/90 flex items-center justify-center z-50 hidden"
    >
      <div
        class="bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full border border-gray-700"
      >
        <h3
          id="alert-title"
          class="text-xl font-bold text-white mb-2"
          data-i18n="alert.title"
          data-i18n="alert.title"
        >
          Alert
        </h3>
        <p id="alert-message" class="text-gray-300 mb-6"></p>
        <button
          id="alert-ok"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200"
        >
          OK
        </button>
      </div>
    </div>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/edit-attachments-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>

    <script type="module" src="/src/js/main.ts"></script>

    <!-- JSON-LD Structured Data -->
  </body>
</html>
