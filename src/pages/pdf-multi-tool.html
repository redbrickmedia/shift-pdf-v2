<!doctype html>
<html lang="en" class="overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Pdf Multi Tool Online Free - Pdf Multi Tool Tool | Shift PDF"
    />
    <meta
      name="description"
      content="★ Pdf Multi Tool online free - Pdf multi tool PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />
    <meta
      name="keywords"
      content="pdf multi tool, pdf multi tool, online pdf"
    />
    <meta name="author" content="Shift PDF" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Pdf Multi Tool Online Free - Pdf Multi Tool Tool | Shift PDF"
    />
    <meta
      property="og:description"
      content="★ Pdf Multi Tool online free - Pdf multi tool PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />

    <meta property="og:site_name" content="Shift PDF" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:title" content="Pdf Multi Tool Free" />
    <meta
      name="twitter:description"
      content="★ Pdf Multi Tool online free - Pdf multi tool PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in brows"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pdf Multi Tool" />

    <title>PDF Multi Tool | Shift PDF</title>

    <link href="/src/css/styles.css" rel="stylesheet" />

    <style>
      /* Hide scrollbar for toolbar overflow */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Fix for mobile toolbar to prevent movement during drag operations */
      .toolbar-container {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        transform: translateZ(0);
        will-change: transform;
      }

      /* Prevent layout shifts during dragging */
      body.dragging {
        overflow: hidden;
      }
    </style>

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/shift-pdf-logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body
    class="antialiased bg-gray-900 h-[100dvh] overflow-hidden flex flex-col"
  >
    {{> navbar }}
    <!-- SEO H1 (visually hidden but present for search engines) -->
    <h1 class="sr-only">PDF Multi Tool Free Online - Edit & Organize PDFs</h1>

    <!-- Main Container -->
    <div class="flex flex-col flex-1 overflow-hidden relative">
      <!-- Toolbar -->
      <div class="toolbar-container shift-chrome-bar flex-none z-20">
        <div class="shift-action-row" role="toolbar" aria-label="PDF actions">
          <div class="shift-action-group" data-shift-action-group="history">
            <button
              id="undo-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="undo"
              aria-label="Undo"
            >
              <i data-lucide="undo-2" aria-hidden="true"></i>
              <span data-i18n="multiTool.undo">Undo</span>
            </button>
            <button
              id="redo-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="redo"
              aria-label="Redo"
            >
              <i data-lucide="redo-2" aria-hidden="true"></i>
              <span data-i18n="multiTool.redo">Redo</span>
            </button>
            <button
              id="reset-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="reset"
              aria-label="Reset"
            >
              <i data-lucide="refresh-ccw" aria-hidden="true"></i>
              <span data-i18n="multiTool.reset">Reset</span>
            </button>
          </div>
          <div class="shift-action-group" data-shift-action-group="output">
            <button
              id="bulk-download-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="download"
              aria-label="Download Selected"
            >
              <i data-lucide="download" aria-hidden="true"></i>
              <span data-i18n="multiTool.downloadSelected"
                >Download Selected</span
              >
            </button>
            <button
              id="export-pdf-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="download"
              aria-label="Export PDF"
            >
              <i data-lucide="download" aria-hidden="true"></i>
              <span data-i18n="multiTool.exportPdf">Export PDF</span>
            </button>
          </div>
          <div class="shift-action-group" data-shift-action-group="extras">
            <button
              id="upload-pdfs-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Upload PDFs"
            >
              <i data-lucide="upload" aria-hidden="true"></i>
              <span data-i18n="multiTool.uploadPdfs">Upload PDFs</span>
            </button>
            <button
              id="add-blank-page-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Add Blank Page"
            >
              <i data-lucide="file-plus" aria-hidden="true"></i>
              <span data-i18n="multiTool.addBlankPage">Add Blank Page</span>
            </button>
            <button
              id="select-all-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Select All"
            >
              <i data-lucide="check-square" aria-hidden="true"></i>
              <span data-i18n="multiTool.selectAll">Select All</span>
            </button>
            <button
              id="deselect-all-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Deselect All"
            >
              <i data-lucide="square" aria-hidden="true"></i>
              <span data-i18n="multiTool.deselectAll">Deselect All</span>
            </button>
            <button
              id="bulk-rotate-left-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Rotate left"
            >
              <i data-lucide="rotate-ccw" aria-hidden="true"></i>
              <span data-i18n="multiTool.rotateLeft">Left</span>
            </button>
            <button
              id="bulk-rotate-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Rotate right"
            >
              <i data-lucide="rotate-cw" aria-hidden="true"></i>
              <span data-i18n="multiTool.rotateRight">Right</span>
            </button>
            <button
              id="bulk-duplicate-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Duplicate"
            >
              <i data-lucide="copy" aria-hidden="true"></i>
              <span data-i18n="multiTool.duplicate">Duplicate</span>
            </button>
            <button
              id="bulk-split-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Split"
            >
              <i data-lucide="scissors" aria-hidden="true"></i>
              <span data-i18n="multiTool.split">Split</span>
            </button>
            <button
              id="bulk-delete-btn"
              type="button"
              class="shift-pdf-viewer-action shift-action-button"
              data-shift-action="extra"
              aria-label="Delete"
            >
              <i data-lucide="trash-2" aria-hidden="true"></i>
              <span data-i18n="multiTool.delete">Delete</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div
        id="main-scroll-container"
        class="flex-1 overflow-auto p-3 pb-24 sm:p-4 sm:pb-8 md:pt-4 md:pb-4"
      >
        <div
          id="upload-area"
          class="hidden border-2 border-dashed border-gray-600 rounded-lg p-6 sm:p-12 text-center max-w-full cursor-pointer"
        >
          <i
            data-lucide="circle-arrow-up"
            class="w-12 h-12 sm:w-16 sm:h-16 mx-auto text-gray-400 mb-3 sm:mb-4"
          ></i>
          <p
            class="text-gray-300 text-base sm:text-lg mb-1 sm:mb-2"
            data-i18n="multiTool.uploadPdfFiles"
          >
            Select PDF or image files
          </p>
          <p
            class="text-gray-400 text-xs sm:text-sm mb-3 sm:mb-4"
            data-i18n="multiTool.dragAndDrop"
          >
            Drag and drop PDF or image files here, or click to select
          </p>
          <input
            type="file"
            id="pdf-file-input"
            accept="application/pdf,image/*,.heic,.heif,.jpg,.jpeg,.png,.bmp,.gif,.tiff,.tif,.webp,.svg,.psd,.jp2,.jpx,.jxr,.pnm,.pgm,.pbm,.ppm,.pam"
            multiple
            class="hidden"
          />
          <button
            id="pdf-file-input-select-btn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 sm:px-6 py-2 rounded text-sm sm:text-base"
            data-i18n="multiTool.selectFiles"
          >
            Select Files
          </button>
        </div>

        <div
          id="pages-container"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4"
        ></div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div
      id="loading-overlay"
      class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center"
    >
      <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4">
        <div class="flex items-center justify-center mb-4">
          <i
            data-lucide="loader"
            class="w-12 h-12 text-indigo-400 animate-spin"
          ></i>
        </div>
        <p
          id="loading-text"
          class="text-white text-center text-lg mb-4"
          data-i18n="multiTool.renderingPages"
        >
          Rendering pages...
        </p>
        <div class="w-full bg-gray-700 rounded-full h-2.5">
          <div
            id="loading-progress"
            class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center"
    >
      <div
        class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4 border border-gray-700"
      >
        <div class="flex items-center justify-center mb-4">
          <div id="modal-icon"></div>
        </div>
        <h3
          id="modal-title"
          class="text-xl font-bold text-white text-center mb-2"
        ></h3>
        <p id="modal-message" class="text-gray-300 text-center mb-6"></p>
        <button
          id="modal-close-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded"
        >
          Close
        </button>
      </div>
    </div>

    <!-- Hidden File Input -->
    <input
      type="file"
      id="insert-pdf-input"
      accept="application/pdf"
      class="hidden"
    />

    <!-- Scripts -->
    <script type="module" src="/src/js/logic/pdf-multi-tool.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>

    <!-- JSON-LD Structured Data -->
  </body>
</html>
