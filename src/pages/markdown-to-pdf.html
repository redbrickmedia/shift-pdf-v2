<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Markdown To Pdf Online Free - Markdown To Pdf Tool | Shift PDF"
    />
    <meta
      name="description"
      content="★ Markdown To Pdf online free - Markdown to pdf PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />
    <meta
      name="keywords"
      content="markdown to pdf, markdown to pdf, online pdf"
    />
    <meta name="author" content="Shift PDF" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Markdown To Pdf Online Free - Markdown To Pdf Tool | Shift PDF"
    />
    <meta
      property="og:description"
      content="★ Markdown To Pdf online free - Markdown to pdf PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in browser ★ Fast & secure"
    />

    <meta property="og:site_name" content="Shift PDF" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:title" content="Markdown To Pdf Free" />
    <meta
      name="twitter:description"
      content="★ Markdown To Pdf online free - Markdown to pdf PDFs easily ★ No signup ★ Unlimited files ★ Privacy-first ★ Works in bro"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Markdown To Pdf" />

    <title>Markdown to PDF | Shift PDF</title>
    <meta
      name="description"
      content="Convert Markdown to PDF with live preview. Free, secure, and runs entirely in your browser."
    />

    <link href="/src/css/styles.css" rel="stylesheet" />
    <link href="/src/css/markdown-editor.css" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/shift-pdf-logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div class="min-h-screen py-8 px-4">
      <div class="max-w-7xl mx-auto">
        <div
          class="bg-gray-800 rounded-xl shadow-xl p-6 border border-gray-700"
        >
          <button
            id="back-to-tools"
            class="flex items-center gap-2 text-indigo-400 hover:text-indigo-300 mb-6 font-semibold"
          >
            <i data-lucide="arrow-left" class="cursor-pointer"></i>
            <span class="cursor-pointer" data-i18n="tools.backToTools"
              >Back</span
            >
          </button>

          <h1
            class="text-2xl font-bold text-white mb-2"
            data-i18n="tools:markdownToPdf.name"
          >
            Markdown to PDF
          </h1>
          <p
            class="text-gray-400 mb-6"
            data-i18n="tools:markdownToPdf.subtitle"
          >
            Write or paste Markdown and export it as a beautifully formatted
            PDF.
          </p>

          <!-- Editor container -->
          <div id="markdown-editor-container"></div>
        </div>
      </div>
    </div>

    {{> footer }}

    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/markdown-to-pdf-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>

    <!-- JSON-LD Structured Data -->
  </body>
</html>
