# Cloudflare Git integration reports builds as check runs, not GitHub Deployments.
# Mirror successful (and failed) Pages builds into the repo Deployments tab.
name: Record Cloudflare Pages deployment

on:
  check_run:
    types: [completed]

permissions:
  deployments: write
  checks: read
  contents: read

jobs:
  record:
    if: github.event.check_run.app.slug == 'cloudflare-workers-and-pages' && github.event.check_run.name == 'Cloudflare Pages'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkRun = context.payload.check_run;
            const sha = checkRun.head_sha;
            const conclusion = checkRun.conclusion;
            const detailsUrl = checkRun.details_url;
            const summary = checkRun.output?.summary || '';

            if (!['success', 'failure', 'timed_out'].includes(conclusion)) {
              core.info(`Skipping check conclusion: ${conclusion}`);
              return;
            }

            let branch = checkRun.check_suite?.head_branch || null;
            if (!branch && checkRun.check_suite?.id) {
              const suite = await github.rest.checks.getSuite({
                owner,
                repo,
                check_suite_id: checkRun.check_suite.id,
              });
              branch = suite.data.head_branch;
            }

            const previewMatch = summary.match(
              /https:\/\/[a-z0-9]+\.shift-pdf-neo\.pages\.dev/
            );
            const previewUrl = previewMatch ? previewMatch[0] : null;
            const isProduction = branch === 'main';
            const environment = isProduction ? 'production' : 'preview';
            const environmentUrl = isProduction
              ? 'https://shift-pdf-neo.pages.dev'
              : previewUrl || 'https://shift-pdf-neo.pages.dev';

            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: sha,
              environment,
              auto_merge: false,
              required_contexts: [],
              production_environment: isProduction,
              transient_environment: !isProduction,
              description: isProduction
                ? 'Cloudflare Pages production'
                : `Cloudflare Pages preview (${branch || 'unknown branch'})`,
            });

            const state =
              conclusion === 'success'
                ? 'success'
                : conclusion === 'timed_out'
                  ? 'error'
                  : 'failure';

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state,
              environment,
              environment_url: environmentUrl,
              log_url: detailsUrl,
              description:
                conclusion === 'success'
                  ? 'Cloudflare Pages deploy succeeded'
                  : 'Cloudflare Pages deploy failed',
            });
