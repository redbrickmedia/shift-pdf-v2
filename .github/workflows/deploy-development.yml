name: Deploy to Development

# Starter-shaped development deploy (see shift-integrated-app-starter).
# Next.js pieces from integrated-apps-deploy-cloudflare are skipped:
# pnpm, pages:build, and .vercel/output/static. This app builds dist/.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  deploy_development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Build
        env:
          HUSKY: 0
          VITE_BRAND_NAME: Shift PDF
          VITE_BRAND_LOGO: images/shift-pdf-logo.svg
          VITE_FOOTER_TEXT: Shift PDF — files stay in your browser
        run: npm run build

      - name: Deploy to Development
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4bff8d4d2bb0eb90fd63b5149bbf96c5"
          wranglerVersion: "4"
          command: pages deploy dist --project-name=shift-pdf-v2 --branch=development

      - name: Add Deployment Info to Pull Request
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment_tag: deployment_id
          message: |
            | Deployment  |  |
            | ------------- | ------------- |
            | URL  | ${{ steps.deploy.outputs.deployment-url }}  |
            | Environment  | ${{ steps.deploy.outputs.pages-environment }}  |
