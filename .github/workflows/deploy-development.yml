name: Deploy to Development

# Vite MPA → Cloudflare Pages preview.
# The shared integrated-apps action assumes pnpm + next-on-pages
# (.vercel/output/static), so this repo builds dist/ itself.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  HUSKY: 0
  VITE_BRAND_NAME: Shift PDF
  VITE_BRAND_LOGO: images/shift-pdf-logo.svg
  VITE_FOOTER_TEXT: Shift PDF — files stay in your browser

jobs:
  deploy_development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve Pages branch
        id: pages_branch
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "name=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "name=development" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4bff8d4d2bb0eb90fd63b5149bbf96c5"
          wranglerVersion: "4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=shift-pdf-v2 --branch=${{ steps.pages_branch.outputs.name }}

      - name: Add Deployment Info to Pull Request
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment_tag: deployment_id
          message: |
            | Deployment | |
            | ---------- | --- |
            | URL | ${{ steps.deploy.outputs.deployment-url }} |
            | Alias | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |
            | Environment | ${{ steps.deploy.outputs.pages-environment }} |
