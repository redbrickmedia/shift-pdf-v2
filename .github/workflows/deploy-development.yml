name: Deploy to Development

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy_development:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets:
      api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      branch: development

  comment:
    needs: deploy_development
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add deployment info to pull request
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: deployment_id
          message: |
            | Deployment  |  |
            | ------------- | ------------- |
            | URL  | ${{ needs.deploy_development.outputs.url }}  |
            | Environment  | ${{ needs.deploy_development.outputs.environment }}  |
