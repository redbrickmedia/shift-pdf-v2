<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concept C — Token-only</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --nav: #f3f4f6;
        --text: #111827;
        --muted: #374151;
        --border: #e6e9ef;
        --brand: #2563eb;
        --card: #fff;
        --card-border: #d1d5db;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: var(--nav);
        border-bottom: 1px solid var(--border);
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .logo {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 700;
      }
      .logo img {
        width: 20px;
        height: 20px;
      }
      header nav a {
        margin-left: 16px;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        color: var(--brand);
        background: #eff6ff;
        padding: 4px 8px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      .hero {
        text-align: center;
        margin-bottom: 40px;
      }
      .hero h1 {
        margin: 0 0 8px;
      }
      .hero p {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
      }
      .card {
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 20px 12px;
        text-align: center;
        background: var(--card);
        font-weight: 600;
        font-size: 13px;
      }
      .card:hover {
        border-color: var(--brand);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="shift-pdf-logo.svg" alt="" />
        Shift PDF
      </div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Tools</a>
      </nav>
    </header>
    <main>
      <div class="badge">Concept C — Token-only</div>
      <div class="hero">
        <h1>Privacy-first PDF toolkit</h1>
        <p>Same Bento layout and IA; Shift colors, type, and logo only.</p>
      </div>
      <div class="grid">
        <div class="card">Merge PDF</div>
        <div class="card">Compress PDF</div>
        <div class="card">Split PDF</div>
        <div class="card">Sign PDF</div>
        <div class="card">Word to PDF</div>
        <div class="card">PDF to JPG</div>
        <div class="card">Encrypt</div>
        <div class="card">OCR PDF</div>
      </div>
    </main>
  </body>
</html>
